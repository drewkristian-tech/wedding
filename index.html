<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teo & Kristian | Save the Date</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fcfbf9; /* Soft off-white tone */
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card-container {
      max-width: 650px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .save-the-date-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Subtle border drop shadow */

<body>

  <main class="card-container">
    <img src="save-the-date.jpg" alt="Teo & Kristian - Save the Date" class="save-the-date-img">

</html>
